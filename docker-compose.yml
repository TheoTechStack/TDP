# Local run: `docker compose up --build` then open http://localhost:8080
name: dispute-portal

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: disputes
      POSTGRES_USER: disputes
      POSTGRES_PASSWORD: disputes
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disputes -d disputes"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=disputes;Username=disputes;Password=disputes
      Jwt__SigningKey: local-compose-signing-key-change-me-0123456789
      Seed__Enabled: "true"

volumes:
  db-data:
