# Local run: `cp .env.example .env`, set DEMO_PASSWORD in it, then `docker compose up --build`
# and open http://localhost:8080
name: dispute-portal

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: disputes
      POSTGRES_USER: disputes
      POSTGRES_PASSWORD: disputes
    # Exposed on 5433 so it never clashes with a Postgres already running on the host.
    # The app container still reaches it on db:5432 over the compose network.
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disputes -d disputes"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=disputes;Username=disputes;Password=disputes
      Jwt__SigningKey: local-compose-signing-key-change-me-0123456789
      Seed__Enabled: "true"
      # From the git-ignored .env file: the demo password is never committed.
      Seed__DemoPassword: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env (copy .env.example)}
      Seed__RevealDemoPassword: "true"

volumes:
  db-data:
