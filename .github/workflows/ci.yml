name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - run: dotnet test --no-build --configuration Release --logger "trx" --collect "XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: "**/TestResults/**"

  web:
    name: Web (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dispute-portal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
