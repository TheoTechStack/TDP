name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # re-run a deploy by hand from the Actions tab

# Superseded PR runs are cancelled. Runs on main are never cancelled mid-way: killing a deploy
# during `terraform apply` would leave the state lock held.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api:
    name: API (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      # Report-only while this is a demo under review: a CVE published tomorrow against a package we didn't
      # touch shouldn't block a redeploy. Findings show as a warning on the run and a list in the summary.
      # For production, make this fail on high/critical instead.
      - name: Check NuGet packages for known vulnerabilities (report only)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::warning title=Vulnerable NuGet packages::See the job summary for the list."
            { echo "### ⚠️ Vulnerable NuGet packages"; echo '```'; cat vulnerable.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ No known vulnerable NuGet packages" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: dotnet build --no-restore --configuration Release
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - run: dotnet test --no-build --configuration Release --logger "trx" --collect "XPlat Code Coverage"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-test-results
          path: "**/TestResults/**"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not only the latest: a secret deleted later is still leaked
      - name: Scan the repository history for committed secrets
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  web:
    name: Web (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Report-only, as for NuGet above. Only packages that ship to the browser (--omit=dev), high and critical.
      - name: Check npm packages for known vulnerabilities (report only)
        run: |
          if npm audit --omit=dev --audit-level=high > audit.txt 2>&1; then
            echo "### ✅ No high or critical npm vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
          else
            cat audit.txt
            echo "::warning title=Vulnerable npm packages::See the job summary for the list."
            { echo "### ⚠️ npm audit (high and critical)"; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm test
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [api, web, secrets]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: dispute-portal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS
    needs: [api, web, image] # only after every test and the image build pass
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Native ARM64 build to match the Graviton tasks (free for public repos).
    # For a private repo, set the repository variable CPU_ARCHITECTURE=X86_64.
    runs-on: ${{ vars.CPU_ARCHITECTURE == 'X86_64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    environment:
      name: production # add required reviewers in GitHub to gate deploys
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: production
      cancel-in-progress: false # deploys queue; they never overlap
    permissions:
      id-token: write # OIDC: short-lived AWS credentials, no stored keys
      contents: read
    env:
      AWS_REGION: eu-west-1
      CPU_ARCHITECTURE: ${{ vars.CPU_ARCHITECTURE || 'ARM64' }}
      # Free-plan AWS accounts allow 1 day of RDS backups; use 7 on a paid account.
      TF_VAR_db_backup_retention_days: ${{ vars.DB_BACKUP_RETENTION_DAYS || '1' }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false # the wrapper breaks `terraform output -raw` in scripts

      - name: Ensure AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            arch=$([ "$(uname -m)" = aarch64 ] && echo aarch64 || echo x86_64)
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${arch}.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp && sudo /tmp/aws/install
          fi
          aws --version

      - name: Deploy
        id: deploy
        run: |
          ./scripts/deploy.sh
          echo "url=$(terraform -chdir=infra/terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
